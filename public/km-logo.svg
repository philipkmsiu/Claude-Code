<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="KM">
  <style>
    .km-mark { transform-origin: 100px 90px; }
    .km-bob {
      animation: km-bob 3.2s ease-in-out infinite;
      transform-origin: 100px 90px;
    }
    .km-tilt {
      animation: km-tilt 4.5s ease-in-out infinite;
      transform-origin: 72px 40px;
    }
    .km-dash {
      animation: km-dash 2.8s ease-in-out infinite;
      transform-origin: 78px 72px;
    }
    @keyframes km-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes km-tilt {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-2px) rotate(-4deg); }
    }
    @keyframes km-dash {
      0%, 100% { transform: translate(0,0) rotate(0deg); opacity: 1; }
      50% { transform: translate(2px, -3px) rotate(6deg); opacity: 0.85; }
    }
  </style>
  <g class="km-bob">
    <!-- grey accent cap on K -->
    <rect class="km-tilt" x="48" y="18" width="26" height="16" rx="5" fill="#6E6E6E"/>
    <!-- K stem + diagonal -->
    <path fill="#C8102E" d="M42 142 V36 c0-5 3-8 8-8 h16 c4 0 7 3 7 8 v40 l28-40 c3-5 8-8 14-8 h12 c6 0 10 7 6 12 L88 92 l46 50 c4 5 1 13-6 13 H114 c-6 0-11-3-14-8 L88 112 V142 c0 5-3 8-8 8 H50 c-5 0-8-3-8-8 z"/>
    <!-- grey K crook -->
    <path class="km-dash" fill="#6E6E6E" d="M70 58 c12 2 20 14 26 28 -10-2-18-4-28-4 -4 0-6-3-5-7 2-7 4-14 7-17 z"/>
    <!-- M rooftops -->
    <path fill="#C8102E" d="M108 142 V52 c0-7 4-12 11-12 h14 c6 0 10 4 12 10 l14 40 14-40 c2-6 6-10 12-10 h14 c7 0 11 5 11 12 v90 c0 5-3 8-8 8 h-18 c-5 0-8-3-8-8 V78 l-11 30 c-2 5-7 8-12 8 h-4 c-5 0-10-3-12-8 L131 78 v64 c0 5-3 8-8 8 h-18 c-5 0-8-3-8-8 z"/>
  </g>
</svg>
